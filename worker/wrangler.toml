# Cloudflare reads this file when it deploys the Worker from GitHub.
# "name" must match the Worker's name in Cloudflare exactly.
name = "scouting-signup"
main = "worker.js"
compatibility_date = "2026-10-15"

# Storage for sign-ups. Paste your KV namespace ID between the quotes.
[[kv_namespaces]]
binding = "SIGNUPS"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

[vars]
# After GitHub Pages is live, set this to your Pages address, e.g. "https://yourusername.github.io"
# (no repo name, no trailing slash). Leave it empty to accept submissions from anywhere while testing.
ALLOWED_ORIGIN = ""

# ADMIN_KEY is a secret, so it is NOT stored here. Set it once in the Cloudflare dashboard
# (Settings > Variables and Secrets). Secrets stay in place through every GitHub deploy.
